<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora de Frete ML Full</title>
<link rel="icon" type="image/png" href="Design novo.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --bg2: #1a1a1a; --bg3: #222222;
    --border: #2e2e2e; --border2: #3a3a3a;
    --text: #e8e8e8; --text2: #888; --text3: #555;
    --accent: #d4ff4e; --accent2: #a8cc3d;
    --accent-dim: rgba(212,255,78,0.08); --accent-dim2: rgba(212,255,78,0.15);
    --red: #ff6b6b; --red-dim: rgba(255,107,107,0.1);
    --orange: #ffaa44; --orange-dim: rgba(255,170,68,0.1);
    --blue: #4ea8ff; --blue-dim: rgba(78,168,255,0.1);
    --mono: 'IBM Plex Mono', monospace; --sans: 'IBM Plex Sans', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 14px; min-height: 100vh; padding: 24px; }

  /* TABS */
  .tabs { display: flex; gap: 2px; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
  .tab { font-family: var(--mono); font-size: 12px; padding: 10px 18px; background: none; border: none; color: var(--text3); cursor: pointer; letter-spacing: 0.04em; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s; }
  .tab:hover { color: var(--text2); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
  .header-left { display: flex; align-items: baseline; gap: 14px; }
  h1 { font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: 0.02em; }
  .badge { font-family: var(--mono); font-size: 10px; padding: 2px 7px; background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(212,255,78,0.25); border-radius: 3px; letter-spacing: 0.05em; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  .btn { font-family: var(--mono); font-size: 11px; font-weight: 500; padding: 6px 14px; border-radius: 4px; border: 1px solid var(--border2); background: var(--bg2); color: var(--text2); cursor: pointer; letter-spacing: 0.03em; transition: all 0.15s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .btn-primary { background: var(--accent); color: #0f0f0f; border-color: var(--accent); font-weight: 500; }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: #0f0f0f; }
  .btn-danger { border-color: var(--border2); color: var(--text3); }
  .btn-danger:hover { border-color: var(--red); color: var(--red); background: var(--red-dim); }

  /* CONSULTA SKU */
  .consulta-wrap { max-width: 680px; }
  .search-sku-row { display: flex; gap: 10px; margin-bottom: 24px; }
  .search-sku-row input { flex: 1; font-family: var(--mono); font-size: 14px; background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 6px; outline: none; transition: border-color 0.15s; text-transform: uppercase; }
  .search-sku-row input:focus { border-color: var(--border2); }
  .search-sku-row input::placeholder { color: var(--text3); text-transform: none; }

  .sku-result { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
  .sku-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .sku-name { font-family: var(--mono); font-size: 16px; font-weight: 500; color: var(--accent); }
  .sku-dims { font-family: var(--mono); font-size: 11px; color: var(--text3); }
  .sku-pesos { display: flex; gap: 20px; margin-bottom: 20px; }
  .sku-peso-item { display: flex; flex-direction: column; gap: 2px; }
  .sku-peso-label { font-size: 11px; color: var(--text3); font-family: var(--mono); }
  .sku-peso-val { font-size: 13px; font-family: var(--mono); color: var(--text2); }

  .faixas-title { font-family: var(--mono); font-size: 11px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 12px; }

  .faixas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .faixa-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  .faixa-card-label { font-family: var(--mono); font-size: 10px; color: var(--text3); margin-bottom: 4px; }
  .faixa-card-preco { font-family: var(--mono); font-size: 11px; color: var(--text2); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .faixa-card-valor { font-family: var(--mono); font-size: 17px; font-weight: 500; color: var(--text); }
  .faixa-card-valor span { font-size: 11px; color: var(--text3); font-weight: 400; }

  .divider-h { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  .sku-not-found { font-family: var(--mono); font-size: 13px; color: var(--text3); padding: 40px 0; text-align: center; }
  .sugestoes { margin-top: 6px; }
  .sug-item { font-family: var(--mono); font-size: 12px; color: var(--text2); padding: 5px 10px; border-radius: 4px; cursor: pointer; display: inline-block; border: 1px solid var(--border); margin: 3px; transition: all 0.12s; }
  .sug-item:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

  /* LISTA PRODUTOS */
  .search-wrap { margin-bottom: 20px; position: relative; }
  .search-wrap input { width: 100%; font-family: var(--mono); font-size: 13px; background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 9px 14px 9px 36px; border-radius: 6px; outline: none; transition: border-color 0.15s; }
  .search-wrap input:focus { border-color: var(--border2); }
  .search-wrap input::placeholder { color: var(--text3); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text3); font-size: 14px; pointer-events: none; }

  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
  thead tr { border-bottom: 1px solid var(--border); }
  th { text-align: left; padding: 0 12px 10px; color: var(--text3); font-weight: 400; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
  th:first-child { padding-left: 0; }
  th.right { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; cursor: pointer; }
  tbody tr:hover { background: var(--bg2); }
  td { padding: 11px 12px; color: var(--text); vertical-align: middle; }
  td:first-child { padding-left: 0; }
  td.right { text-align: right; }
  td.muted { color: var(--text2); }
  td.accent { color: var(--accent); font-weight: 500; }
  .sku-cell { font-weight: 500; letter-spacing: 0.02em; }
  .dim-cell { color: var(--text2); font-size: 11px; }
  .tag { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 3px; font-weight: 500; letter-spacing: 0.04em; }
  .tag-cubico { background: var(--accent-dim2); color: var(--accent); border: 1px solid rgba(212,255,78,0.2); }
  .tag-real { background: var(--orange-dim); color: var(--orange); border: 1px solid rgba(255,170,68,0.2); }
  .tag-xlsx { background: var(--blue-dim); color: var(--blue); border: 1px solid rgba(78,168,255,0.2); }

  .empty-state { text-align: center; padding: 60px 0; color: var(--text3); font-family: var(--mono); font-size: 12px; }
  .empty-state .big { font-size: 32px; margin-bottom: 12px; opacity: 0.3; }
  .count-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .count-label { font-family: var(--mono); font-size: 11px; color: var(--text3); }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: 10px; width: 480px; max-width: 95vw; padding: 24px; animation: slide-up 0.2s ease; }
  @keyframes slide-up { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .modal-title { font-family: var(--mono); font-size: 13px; font-weight: 500; }
  .modal-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 18px; line-height: 1; padding: 4px; transition: color 0.15s; }
  .modal-close:hover { color: var(--text); }
  .form-row { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-end; }
  .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .form-group label { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; }
  .form-group input { font-family: var(--mono); font-size: 13px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 5px; outline: none; transition: border-color 0.15s; width: 100%; }
  .form-group input:focus { border-color: var(--accent); }
  .form-group input::placeholder { color: var(--text3); }
  .form-sep { font-size: 16px; color: var(--text3); padding-bottom: 9px; flex: 0; }
  .preview-box { background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 14px; margin: 18px 0; display: flex; }
  .preview-item { flex: 1; text-align: center; padding: 0 8px; border-right: 1px solid var(--border); }
  .preview-item:last-child { border-right: none; }
  .preview-label { font-family: var(--mono); font-size: 10px; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 5px; }
  .preview-value { font-family: var(--mono); font-size: 18px; font-weight: 500; color: var(--text); }
  .preview-value.highlight { color: var(--accent); }
  .preview-sub { font-family: var(--mono); font-size: 10px; color: var(--text3); margin-top: 3px; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  .error-msg { font-family: var(--mono); font-size: 11px; color: var(--red); margin-top: 4px; display: none; }

  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 6px; padding: 10px 16px; font-family: var(--mono); font-size: 12px; color: var(--text); z-index: 200; opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { border-color: rgba(212,255,78,0.3); color: var(--accent); }

  .faixa-card.destacado { background: var(--accent-dim2); border-color: var(--accent); }
  .faixa-card.destacado .faixa-card-preco { color: var(--accent); }
  .faixa-card.destacado .faixa-card-valor { color: var(--accent); }
  .faixa-card.apagado { opacity: 0.35; }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Frete ML Full</h1>
    <span class="badge">2026</span>
  </div>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('consulta')">consultar SKU</button>
  <button class="tab" onclick="switchTab('produtos')">produtos</button>
</div>

<!-- ====== TAB: CONSULTA ====== -->
<div id="tab-consulta" class="tab-content active">
  <div class="consulta-wrap">
    <div class="search-sku-row">
      <input type="text" id="sku-input" placeholder="Digite o SKU..." autocomplete="off" oninput="consultarSKU()">
    </div>
    <div id="simular-preco-row" style="display:none; margin-bottom:20px; max-width:320px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <label style="font-family:var(--mono); font-size:11px; color:var(--text3); white-space:nowrap; letter-spacing:0.05em; text-transform:uppercase;">Simular preço de venda</label>
        <div style="display:flex; align-items:center; gap:6px; flex:1;">
          <span style="font-family:var(--mono); font-size:13px; color:var(--text3);">R$</span>
          <input type="number" id="simular-preco-input" placeholder="ex: 129,90" step="0.01" min="0"
            style="font-family:var(--mono); font-size:13px; background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:8px 10px; border-radius:5px; outline:none; transition:border-color 0.15s; width:100%;"
            oninput="consultarSKU()" onfocus="this.style.borderColor='var(--border2)'" onblur="this.style.borderColor='var(--border)'">
        </div>
      </div>
    </div>
    <div id="sku-resultado"></div>
  </div>
</div>

<!-- ====== TAB: PRODUTOS ====== -->
<div id="tab-produtos" class="tab-content">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <div></div>
    <div style="display:flex; gap:8px;">
      <button class="btn" onclick="exportCSV()">↓ exportar CSV</button>
      <button class="btn btn-primary" onclick="abrirModal()">+ novo produto</button>
    </div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" id="search" placeholder="buscar por SKU..." oninput="renderTabela()">
  </div>
  <div class="count-bar">
    <span class="count-label" id="count-label">0 produtos</span>
  </div>
  <table>
    <thead>
      <tr>
        <th>SKU</th>
        <th>Dimensões (cm)</th>
        <th class="right">Peso real</th>
        <th class="right">Peso ML</th>
        <th class="right">Frete</th>
        <th class="right">Base</th>
        <th class="right">Origem</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty-state" class="empty-state" style="display:none;">
    <div class="big">▣</div>
    <div>nenhum produto cadastrado ainda</div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="fecharModalOverlay(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Novo produto</span>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2;">
        <label>SKU</label>
        <input type="text" id="f-sku" placeholder="ex: CADALM4-AZ">
      </div>
      <div class="form-group">
        <label>Peso real (kg)</label>
        <input type="number" id="f-peso" placeholder="ex: 3.5" step="0.01" min="0" oninput="atualizarPreview()">
      </div>
      <div class="form-group">
        <label>Preço venda (R$)</label>
        <input type="number" id="f-preco" placeholder="ex: 129.90" step="0.01" min="0" oninput="atualizarPreview()">
      </div>
    </div>
    <div class="form-group" style="margin-bottom:6px;">
      <label>Dimensões reais do ML (cm)</label>
    </div>
    <div class="form-row" style="margin-bottom:0;">
      <div class="form-group"><label style="opacity:0.5;">Comp.</label><input type="number" id="f-c" placeholder="57.8" step="0.1" min="0" oninput="atualizarPreview()"></div>
      <div class="form-sep">×</div>
      <div class="form-group"><label style="opacity:0.5;">Larg.</label><input type="number" id="f-l" placeholder="44.6" step="0.1" min="0" oninput="atualizarPreview()"></div>
      <div class="form-sep">×</div>
      <div class="form-group"><label style="opacity:0.5;">Alt.</label><input type="number" id="f-a" placeholder="29.4" step="0.1" min="0" oninput="atualizarPreview()"></div>
    </div>
    <span class="error-msg" id="error-msg">Preencha o SKU e todas as dimensões.</span>
    <div class="preview-box" id="preview-box">
      <div class="preview-item"><div class="preview-label">Cúbico</div><div class="preview-value" id="prev-cubico">—</div><div class="preview-sub">kg</div></div>
      <div class="preview-item"><div class="preview-label">Peso ML</div><div class="preview-value" id="prev-pesoml">—</div><div class="preview-sub">kg</div></div>
      <div class="preview-item"><div class="preview-label">Frete c/ preço</div><div class="preview-value highlight" id="prev-frete-especifico">—</div><div class="preview-sub" id="prev-frete-sub">cadastre preço</div></div>
      <div class="preview-item"><div class="preview-label">Frete máx.</div><div class="preview-value highlight" id="prev-frete-max">—</div><div class="preview-sub">acima R$ 200</div></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-deletar" onclick="deletarProduto()" style="display:none; margin-right:auto;">deletar</button>
      <button class="btn" onclick="fecharModal()">cancelar</button>
      <button class="btn btn-primary" onclick="salvarProduto()">salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// TABELAS DE FRETE (extraídas do xlsx)
// Formato: [limite_superior_kg, col1, col2, ...]
// ============================================================

// Tabela FIXA (até R$ 78,99): [lim, r0_18, r19_48, r49_78]
const TABFIX = [[0.3,5.65,6.55,7.75],[0.5,5.95,6.65,7.85],[1,6.05,6.75,7.95],[1.5,6.15,6.85,8.05],[2,6.25,6.95,8.15],[3,6.35,7.95,8.55],[4,6.45,8.15,8.95],[5,6.55,8.35,9.75],[6,6.65,8.55,9.95],[7,6.75,8.75,10.15],[8,6.85,8.95,10.35],[9,6.95,9.15,10.55],[11,7.05,9.55,10.95],[13,7.15,9.95,11.35],[15,7.25,10.15,11.55],[17,7.35,10.35,11.75],[20,7.45,10.55,11.95],[25,7.65,10.95,12.15],[30,7.75,11.15,12.35],[40,7.85,11.35,12.55],[50,7.95,11.55,12.75],[60,8.05,11.75,12.95],[70,8.15,11.95,13.15],[80,8.25,12.15,13.35],[90,8.35,12.35,13.55],[100,8.45,12.55,13.75],[125,8.55,12.75,13.95],[150,8.65,12.75,14.15],[99999,8.75,12.75,14.35]];

// Tabela VARIÁVEL (R$ 79+): [lim, r79_99, r100_119, r120_149, r150_199, r200+]
const TABVAR = [[0.3,12.35,14.35,16.45,18.45,20.95],[0.5,13.25,15.45,17.65,19.85,22.55],[1,13.85,16.15,18.45,20.75,23.65],[1.5,14.15,16.45,18.85,21.15,24.65],[2,14.45,16.85,19.25,21.65,24.65],[3,15.75,18.35,21.05,23.65,26.25],[4,17.05,19.85,22.65,25.55,28.35],[5,18.45,21.55,24.65,27.75,30.75],[6,25.45,28.55,32.65,35.75,39.75],[7,27.05,31.05,36.05,40.05,44.05],[8,28.85,33.65,38.45,43.25,48.05],[9,29.65,34.55,39.55,44.45,49.35],[11,41.25,48.05,54.95,61.75,68.65],[13,42.15,49.25,56.25,63.25,70.25],[15,45.05,52.45,59.95,67.45,74.95],[17,48.55,56.05,63.55,70.75,78.65],[20,54.75,63.85,72.95,82.05,91.15],[25,64.05,75.05,84.75,95.35,105.95],[30,65.95,75.45,85.55,96.25,106.95],[40,67.75,78.95,88.95,99.15,107.05],[50,70.25,81.05,92.05,102.55,110.75],[60,74.95,86.45,98.15,109.35,118.15],[70,80.25,92.95,105.05,117.15,126.55],[80,83.95,97.05,109.85,122.45,132.25],[90,93.25,107.45,122.05,136.05,146.95],[100,106.55,123.95,139.55,155.55,167.95],[125,119.25,138.05,156.05,173.95,187.95],[150,126.55,146.15,165.65,184.65,199.45],[99999,166.15,192.45,217.55,242.55,261.95]];

// Colunas de preço (para exibição)
const COLUNAS_FIX = ['R$ 0–18,99','R$ 19–48,99','R$ 49–78,99'];

const STORAGE_KEY = 'frete-ml-produtos-v2';
let produtos = [];
let editandoIndex = -1;

// ============================================================
// LÓGICA DE FRETE
// ============================================================
const FAIXAS_LABEL = [
  [0.3,  'Até 0,3 kg'],
  [0.5,  'De 0,3 a 0,5 kg'],
  [1,    'De 0,5 a 1 kg'],
  [1.5,  'De 1 a 1,5 kg'],
  [2,    'De 1,5 a 2 kg'],
  [3,    'De 2 a 3 kg'],
  [4,    'De 3 a 4 kg'],
  [5,    'De 4 a 5 kg'],
  [6,    'De 5 a 6 kg'],
  [7,    'De 6 a 7 kg'],
  [8,    'De 7 a 8 kg'],
  [9,    'De 8 a 9 kg'],
  [11,   'De 9 a 11 kg'],
  [13,   'De 11 a 13 kg'],
  [15,   'De 13 a 15 kg'],
  [17,   'De 15 a 17 kg'],
  [20,   'De 17 a 20 kg'],
  [25,   'De 20 a 25 kg'],
  [30,   'De 25 a 30 kg'],
  [40,   'De 30 a 40 kg'],
  [50,   'De 40 a 50 kg'],
  [60,   'De 50 a 60 kg'],
  [70,   'De 60 a 70 kg'],
  [80,   'De 70 a 80 kg'],
  [90,   'De 80 a 90 kg'],
  [100,  'De 90 a 100 kg'],
  [125,  'De 100 a 125 kg'],
  [150,  'De 125 a 150 kg'],
  [99999,'Mais de 150 kg'],
];

function faixaLabel(pesoKg) {
  const f = FAIXAS_LABEL.find(r => pesoKg <= r[0]);
  return f ? f[1] : 'Mais de 150 kg';
}

function buscarFrete(pesoKg) {
  // Retorna objeto com todos os 8 valores de frete
  const fix = TABFIX.find(r => pesoKg <= r[0]);
  const vari = TABVAR.find(r => pesoKg <= r[0]);
  if (!fix || !vari) return null;
  return {
    r0_18:   fix[1], r19_48: fix[2], r49_78: fix[3],
    r79_99:  vari[1], r100_119: vari[2], r120_149: vari[3],
    r150_199: vari[4], r200: vari[5]
  };
}

// Retorna o frete específico dado um preço de venda
function buscarFretePorPreco(pesoKg, preco) {
  if (!preco || preco <= 0) return null;
  const f = buscarFrete(pesoKg);
  if (!f) return null;
  if (preco < 19)   return { valor: f.r0_18,    idx: 0 };
  if (preco < 49)   return { valor: f.r19_48,   idx: 1 };
  if (preco < 79)   return { valor: f.r49_78,   idx: 2 };
  if (preco < 100)  return { valor: f.r79_99,   idx: 3 };
  if (preco < 120)  return { valor: f.r100_119, idx: 4 };
  if (preco < 150)  return { valor: f.r120_149, idx: 5 };
  if (preco < 200)  return { valor: f.r150_199, idx: 6 };
  return { valor: f.r200, idx: 7 };
}

function calcularPesoML(p) {
  const cubico = (p.comp * p.larg * p.alt) / 6000;
  const pesoReal = p.pesoReal || 0;
  return Math.max(cubico, pesoReal);
}

function freteMin(peso) {
  const f = buscarFrete(peso);
  return f ? Math.min(f.r0_18, f.r19_48, f.r49_78) : null;
}
function freteMax(peso) {
  const f = buscarFrete(peso);
  return f ? f.r200 : null;
}

function fmt(n, dec=2) { return n.toFixed(dec).replace('.', ','); }
function fmtR(n) { return 'R$ ' + n.toFixed(2).replace('.', ','); }

// ============================================================
// TABS
// ============================================================
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'produtos') renderTabela();
}

// ============================================================
// CONSULTA SKU
// ============================================================
function getProduto(sku) {
  // Prioridade: produtos do localStorage, depois do xlsx
  const local = produtos.find(p => p.sku.toUpperCase() === sku.toUpperCase());
  if (local) return { ...local, origem: 'local' };
  const xlsx = PRODUTOS_XLSX[sku.toUpperCase()];
  if (xlsx) return { ...xlsx, sku: sku.toUpperCase(), origem: 'xlsx' };
  return null;
}

function consultarSKU() {
  const q = document.getElementById('sku-input').value.trim().toUpperCase();
  const div = document.getElementById('sku-resultado');
  const simularRow = document.getElementById('simular-preco-row');

  if (!q) { div.innerHTML = ''; simularRow.style.display = 'none'; return; }

  const p = getProduto(q);

  if (p) {
    simularRow.style.display = 'block';
    renderResultadoSKU(p, div);
  } else {
    simularRow.style.display = 'none';
    // Sugestões
    const todas = [...Object.keys(PRODUTOS_XLSX), ...produtos.map(p=>p.sku)];
    const unicas = [...new Set(todas)];
    const sugs = unicas.filter(s => s.includes(q)).slice(0, 8);
    let html = `<div class="sku-not-found">SKU não encontrado: <strong>${q}</strong>`;
    if (sugs.length) {
      html += `<div class="sugestoes" style="margin-top:12px;">` +
        sugs.map(s => `<span class="sug-item" onclick="selecionarSug('${s}')">${s}</span>`).join('') +
        `</div>`;
    }
    html += `</div>`;
    div.innerHTML = html;
  }
}

function selecionarSug(sku) {
  document.getElementById('sku-input').value = sku;
  consultarSKU();
}

function renderResultadoSKU(p, div) {
  const pesoML = calcularPesoML(p);
  const cubico = (p.comp * p.larg * p.alt) / 6000;
  const fretes = buscarFrete(pesoML);
  const base = cubico >= (p.pesoReal||0) ? 'cúbico' : 'real';
  const origemBadge = p.origem === 'xlsx'
    ? `<span class="tag tag-xlsx" style="font-size:10px;">xlsx</span>`
    : `<span class="tag tag-cubico" style="font-size:10px;">local</span>`;

  // Pegar preço simulado (do input) ou preço cadastrado do produto
  const simInput = parseFloat(document.getElementById('simular-preco-input').value) || 0;
  const precoSimulado = simInput > 0 ? simInput : (p.precoVenda || 0);
  const freteSimulado = precoSimulado > 0 ? buscarFretePorPreco(pesoML, precoSimulado) : null;
  const idxDestacado = freteSimulado ? freteSimulado.idx : -1;

  const todasColunas = [
    { label: 'R$ 0–18,99',    val: fretes.r0_18 },
    { label: 'R$ 19–48,99',   val: fretes.r19_48 },
    { label: 'R$ 49–78,99',   val: fretes.r49_78 },
    { label: 'R$ 79–99,99',   val: fretes.r79_99 },
    { label: 'R$ 100–119,99', val: fretes.r100_119 },
    { label: 'R$ 120–149,99', val: fretes.r120_149 },
    { label: 'R$ 150–199,99', val: fretes.r150_199 },
    { label: 'R$ 200+',       val: fretes.r200 },
  ];

  // Badge de preço simulado
  let precoSimBadge = '';
  if (precoSimulado > 0) {
    const fonte = simInput > 0 ? 'simulado' : 'cadastrado';
    precoSimBadge = `<span style="font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;background:var(--accent-dim2);color:var(--accent);border:1px solid rgba(212,255,78,0.2);margin-left:8px;">R$ ${fmt(precoSimulado)} (${fonte})</span>`;
  }

  div.innerHTML = `
    <div class="sku-result">
      <div class="sku-header">
        <span class="sku-name">${p.sku}</span>
        ${origemBadge}
        ${precoSimBadge}
      </div>
      <div class="sku-pesos" style="margin-bottom:16px;">
        <div class="sku-peso-item"><span class="sku-peso-label">Dimensões</span><span class="sku-peso-val">${p.comp} × ${p.larg} × ${p.alt} cm</span></div>
        <div class="sku-peso-item"><span class="sku-peso-label">Peso real</span><span class="sku-peso-val">${fmt(p.pesoReal||0)} kg</span></div>
        <div class="sku-peso-item"><span class="sku-peso-label">Peso cúbico</span><span class="sku-peso-val">${fmt(cubico)} kg</span></div>
        <div class="sku-peso-item"><span class="sku-peso-label">Faixa ML (${base})</span><span class="sku-peso-val" style="color:var(--accent);font-weight:500;">${faixaLabel(pesoML)}</span></div>
      </div>
      <div class="faixas-title">frete por faixa de preço de venda${idxDestacado >= 0 ? ' — card destacado é o ativo' : ''}</div>
      <div class="faixas-grid">
        ${todasColunas.map((c, i) => {
          let cardClass = 'faixa-card';
          if (idxDestacado >= 0) {
            cardClass += i === idxDestacado ? ' destacado' : ' apagado';
          }
          return `<div class="${cardClass}">
            <div class="faixa-card-preco">${c.label}</div>
            <div class="faixa-card-valor">R$ ${fmt(c.val)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}

function carregar() {
  try { produtos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) { produtos = []; }
}
function salvarStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(produtos)); }

    const origemTag = p.origem === 'xlsx'
      ? `<span class="tag tag-xlsx">xlsx</span>`
      : `<span class="tag" style="background:var(--accent-dim);color:var(--accent);border:1px solid rgba(212,255,78,0.2);">local</span>`;
    const localIdx = produtos.findIndex(lp => lp.sku.toUpperCase() === p.sku.toUpperCase());
    const editIdx = localIdx >= 0 ? localIdx : -1;
    return `<tr onclick="editarProduto(${editIdx}, '${p.sku}')">
      <td class="sku-cell">${p.sku}</td>
      <td class="dim-cell">${p.comp} × ${p.larg} × ${p.alt}</td>
      <td class="right muted">${fmt(p.pesoReal||0)} kg</td>
      <td class="right muted">${fmt(pesoML)} kg</td>
      ${freCell}
      <td class="right"><span class="tag ${tagClass}">${base2}</span></td>
      <td class="right">${origemTag}</td>
      <td class="right"><button class="btn btn-danger" style="padding:4px 10px;font-size:10px;" onclick="event.stopPropagation();confirmarDeletar(${editIdx},'${p.sku}')">✕</button></td>
    </tr>`;
  }).join('');
}

function editarProduto(idx, sku) {
  if (idx >= 0) { abrirModal(idx); return; }
  // Produto é do xlsx — pre-preenche o modal para criar versão local
  const p = PRODUTOS_XLSX[sku];
  if (!p) return;
  editandoIndex = -1;
  document.getElementById('modal-title').textContent = 'Editar produto (xlsx)';
  document.getElementById('f-sku').value = sku;
  document.getElementById('f-c').value = p.comp;
  document.getElementById('f-l').value = p.larg;
  document.getElementById('f-a').value = p.alt;
  document.getElementById('f-peso').value = p.pesoReal || '';
  document.getElementById('f-preco').value = '';
  document.getElementById('btn-deletar').style.display = 'none';
  document.getElementById('error-msg').style.display = 'none';
  atualizarPreview();
  document.getElementById('modal-overlay').classList.add('open');
}

function confirmarDeletar(idx, sku) {
  if (idx < 0) { toast('Produto do xlsx não pode ser deletado.'); return; }
  if (confirm(`Deletar ${sku}?`)) {
    produtos.splice(idx, 1); salvarStorage(); renderTabela(); toast('Produto removido.');
  }
}

function abrirModal(idx=-1) {
  editandoIndex = idx;
  document.getElementById('error-msg').style.display = 'none';
  if (idx >= 0) {
    const p = produtos[idx];
    document.getElementById('modal-title').textContent = 'Editar produto';
    document.getElementById('f-sku').value = p.sku;
    document.getElementById('f-c').value = p.comp;
    document.getElementById('f-l').value = p.larg;
    document.getElementById('f-a').value = p.alt;
    document.getElementById('f-peso').value = p.pesoReal || '';
    document.getElementById('f-preco').value = p.precoVenda || '';
    document.getElementById('btn-deletar').style.display = 'inline-block';
  } else {
    document.getElementById('modal-title').textContent = 'Novo produto';
    ['f-sku','f-c','f-l','f-a','f-peso','f-preco'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('btn-deletar').style.display = 'none';
  }
  atualizarPreview();
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('f-sku').focus();
}

function fecharModal() { document.getElementById('modal-overlay').classList.remove('open'); editandoIndex = -1; }
function fecharModalOverlay(e) { if (e.target === document.getElementById('modal-overlay')) fecharModal(); }

function atualizarPreview() {
  const c = parseFloat(document.getElementById('f-c').value);
  const l = parseFloat(document.getElementById('f-l').value);
  const a = parseFloat(document.getElementById('f-a').value);
  const pr = parseFloat(document.getElementById('f-peso').value) || 0;
  const pv = parseFloat(document.getElementById('f-preco').value) || 0;
  if (!c||!l||!a) {
    ['prev-cubico','prev-pesoml','prev-frete-especifico','prev-frete-max'].forEach(id => document.getElementById(id).textContent='—');
    document.getElementById('prev-frete-sub').textContent = 'cadastre preço';
    return;
  }
  const cubico = (c*l*a)/6000;
  const pesoML = Math.max(cubico, pr);
  document.getElementById('prev-cubico').textContent = fmt(cubico);
  document.getElementById('prev-pesoml').textContent = fmt(pesoML);
  const fmax = freteMax(pesoML);
  document.getElementById('prev-frete-max').textContent = fmax ? 'R$ '+fmt(fmax) : '—';
  if (pv > 0) {
    const fe = buscarFretePorPreco(pesoML, pv);
    document.getElementById('prev-frete-especifico').textContent = fe ? 'R$ '+fmt(fe.valor) : '—';
    document.getElementById('prev-frete-sub').textContent = 'R$ ' + fmt(pv) + ' p.venda';
  } else {
    document.getElementById('prev-frete-especifico').textContent = '—';
    document.getElementById('prev-frete-sub').textContent = 'cadastre preço';
  }
}

function salvarProduto() {
  const sku = document.getElementById('f-sku').value.trim().toUpperCase();
  const c = parseFloat(document.getElementById('f-c').value);
  const l = parseFloat(document.getElementById('f-l').value);
  const a = parseFloat(document.getElementById('f-a').value);
  const pr = parseFloat(document.getElementById('f-peso').value) || 0;
  const pv = parseFloat(document.getElementById('f-preco').value) || null;
  if (!sku||!c||!l||!a) { document.getElementById('error-msg').style.display='block'; return; }
  const prod = { sku, comp:c, larg:l, alt:a, pesoReal:pr||null, precoVenda: pv };
  if (editandoIndex >= 0) { produtos[editandoIndex] = prod; toast('Atualizado.', true); }
  else { produtos.push(prod); toast('Salvo.', true); }
  salvarStorage(); fecharModal(); renderTabela();
}

function deletarProduto() {
  if (editandoIndex < 0) return;
  confirmarDeletar(editandoIndex, produtos[editandoIndex].sku);
  fecharModal();
}

function exportCSV() {
  const xlsxList = Object.entries(PRODUTOS_XLSX).map(([sku, d]) => ({ ...d, sku, origem: 'xlsx' }));
  const localSkus = new Set(produtos.map(p => p.sku.toUpperCase()));
  const base = [
    ...xlsxList.filter(p => !localSkus.has(p.sku)),
    ...produtos.map(p => ({ ...p, origem: 'local' }))
  ].sort((a,b) => a.sku.localeCompare(b.sku));

  const header = 'SKU,Comp,Larg,Alt,Peso Real,Peso ML,Preco Venda,Frete Especifico,Frete max,Base,Origem';
  const linhas = base.map(p => {
    const pm = calcularPesoML(p);
    const cub = (p.comp*p.larg*p.alt)/6000;
    const base2 = cub >= (p.pesoReal||0) ? 'cubico' : 'real';
    const pv = p.precoVenda || '';
    const fe = pv ? buscarFretePorPreco(pm, pv) : null;
    return [p.sku,p.comp,p.larg,p.alt,p.pesoReal||0,fmt(pm),pv,fe?fmt(fe.valor):'',fmt(freteMax(pm)),base2,p.origem].join(',');
  });
  const csv = [header,...linhas].join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='frete-ml-full.csv'; a.click();
  URL.revokeObjectURL(url);
  toast('CSV exportado!', true);
}

let toastTimer;
function toast(msg, success=false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show' + (success ? ' success' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast'; }, 2500);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharModal();
});

carregar();
</script>
